services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: smo
      POSTGRES_PASSWORD: smo_local_dev
      POSTGRES_DB: show_me_once
    ports:
      - '6543:5432'
    volumes:
      - show_me_once_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U smo -d show_me_once']
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  show_me_once_pg:
